name: Update Starfarer cask

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: update-starfarer
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read published release
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          code=$(curl --silent --show-error --location --retry 5 --retry-connrefused \
            --output "$RUNNER_TEMP/latest.json" --write-out '%{http_code}' \
            https://downloads.starfarer.ai/latest.json)
          case "$code" in
            200) printf 'available=true\n' >> "$GITHUB_OUTPUT" ;;
            404)
              if [[ -f Casks/starfarer.rb ]]; then
                echo 'Published release manifest is missing.' >&2
                exit 1
              fi
              echo 'No release has been published yet.'
              ;;
            *) printf 'Release manifest returned HTTP %s\n' "$code" >&2; exit 1 ;;
          esac
      - name: Generate and verify cask
        if: steps.release.outputs.available == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/update.py "$RUNNER_TEMP/latest.json" Casks/starfarer.rb
          if [[ -z $(git status --porcelain -- Casks/starfarer.rb) ]]; then
            exit 0
          fi
          brew tap --custom-remote nsttt/starfarer "$GITHUB_WORKSPACE"
          cask_dir="$(brew --repository nsttt/starfarer)/Casks"
          mkdir -p "$cask_dir"
          cp Casks/starfarer.rb "$cask_dir/starfarer.rb"
          brew trust --cask nsttt/starfarer/starfarer
          brew style --cask nsttt/starfarer/starfarer
          brew audit --cask nsttt/starfarer/starfarer
          brew fetch --cask nsttt/starfarer/starfarer
      - name: Commit verified release
        if: steps.release.outputs.available == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git add Casks/starfarer.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          version=$(jq -er .macos.tag "$RUNNER_TEMP/latest.json")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: update Starfarer to $version"
          git push origin "HEAD:${GITHUB_REF_NAME}"
